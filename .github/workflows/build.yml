name: Build and test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: |
          cmake --build build --config Release --verbose *> build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content build.log
          if ($buildExitCode -ne 0) {
            Write-Output "::group::First compiler errors"
            Get-Content build.log -Tail 20 | ForEach-Object { Write-Output "::error::$_" }
            Write-Output "::endgroup::"
            Write-Output "::error::Windows build failed with exit code $buildExitCode"
            exit $buildExitCode
          }
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Preserve Windows CLI for local hardware validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-windows-validation
          path: |
            build/Release/clearmic-cli.exe
            build/Release/clearmic-desktop.exe
          retention-days: 3
      - name: Build Windows installer
        run: cpack --config build/CPackConfig.cmake -G WIX -B build/installer
      - name: Install and remove Windows installer
        shell: pwsh
        run: |
          $installerLog = Join-Path $env:RUNNER_TEMP "clearmic-msi.log"
          $installer = Get-ChildItem -Path build/installer -Filter *.msi | Select-Object -First 1
          if (-not $installer) { throw "CPack did not produce a Windows MSI" }
          Write-Output "Installing MSI: $($installer.FullName)"
          $installProcess = Start-Process -FilePath "$env:WINDIR\System32\msiexec.exe" `
            -ArgumentList @("/i", "`"$($installer.FullName)`"", "/qn", "/norestart", "/l*v", "`"$installerLog`"") `
            -Wait -PassThru
          $installExitCode = $installProcess.ExitCode
          Write-Output "MSI installation process exited with code $installExitCode"
          if ($installExitCode -notin @(0, 3010)) {
            if (Test-Path -LiteralPath $installerLog) { Get-Content $installerLog }
            else { Write-Output "MSI log was not created at $installerLog" }
            throw "MSI installation failed with exit code $installExitCode"
          }
          Write-Output "MSI installation completed with exit code $installExitCode"
          $registryPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall"
          $product = Get-ChildItem $registryPath | Get-ItemProperty | Where-Object DisplayName -Like "*ClearMic*" | Select-Object -First 1
          if (-not $product) { throw "Windows Installer did not register ClearMic" }
          $installRoot = $product.InstallLocation
          if (-not $installRoot) { $installRoot = Join-Path $env:ProgramFiles "ClearMic" }
          Write-Output "ClearMic install location: $installRoot"
          if (-not (Test-Path -LiteralPath $installRoot)) { throw "MSI install location does not exist: $installRoot" }
          $installedFiles = Get-ChildItem -LiteralPath $installRoot -File -Recurse
          Write-Output "Installed files: $($installedFiles.FullName -join ', ')"
          if (-not ($installedFiles.Name -contains "clearmic-desktop.exe")) { throw "Installed desktop application was not found" }
          if (-not ($installedFiles.Name -contains "clearmic-cli.exe")) { throw "Installed CLI was not found" }
          foreach ($requiredNotice in @("LICENSE", "THIRD_PARTY_NOTICES.md", "COPYING")) {
            if (-not ($installedFiles.Name -contains $requiredNotice)) { throw "Installed license notice was not found: $requiredNotice" }
          }
          $desktopExecutable = $installedFiles | Where-Object Name -eq "clearmic-desktop.exe" | Select-Object -First 1
          $desktopProcess = Start-Process -FilePath $desktopExecutable.FullName -PassThru
          Write-Output "Launched installed desktop application with PID $($desktopProcess.Id)"
          Start-Sleep -Seconds 2
          $desktopProcess.Refresh()
          if ($desktopProcess.HasExited) { throw "Installed desktop application exited during startup" }
          if (-not $desktopProcess.CloseMainWindow()) { Stop-Process -Id $desktopProcess.Id -Force }
          if (-not $desktopProcess.HasExited -and -not $desktopProcess.WaitForExit(5000)) {
            Stop-Process -Id $desktopProcess.Id -Force
            throw "Installed desktop application did not close after a window-close request"
          }
          $removeProcess = Start-Process -FilePath "$env:WINDIR\System32\msiexec.exe" `
            -ArgumentList @("/x", "`"$($installer.FullName)`"", "/qn", "/norestart", "/l*v", "`"$installerLog`"") `
            -Wait -PassThru
          $removeExitCode = $removeProcess.ExitCode
          Write-Output "MSI removal process exited with code $removeExitCode"
          if ($removeExitCode -notin @(0, 3010)) {
            if (Test-Path -LiteralPath $installerLog) { Get-Content $installerLog }
            else { Write-Output "MSI log was not created at $installerLog" }
            throw "MSI removal failed with exit code $removeExitCode"
          }
          Write-Output "MSI removal completed with exit code $removeExitCode"
          $remainingFiles = Get-ChildItem -LiteralPath $installRoot -File -Recurse -ErrorAction SilentlyContinue
          if ($remainingFiles.Name -contains "clearmic-desktop.exe") { throw "MSI removal left the desktop application installed" }
      - name: Preserve MSI installation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-windows-msi-log
          path: ${{ runner.temp }}/clearmic-msi.log
          retention-days: 3
      - name: Preserve Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-windows-msi
          path: build/installer/*.msi
          retention-days: 3
      - name: Preserve Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-windows-build-log
          path: build.log
          retention-days: 3

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux development dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpipewire-0.3-dev libgtk-3-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good pkg-config xdotool xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build --config Release --verbose 2>&1 | tee build.log
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure | tee test.log
      - name: Launch GTK desktop panel
        run: |
          timeout --signal=TERM 10s xvfb-run -a bash -euo pipefail -c '
            build/clearmic-cli gui &
            app_pid=$!
            window_id=""
            for _ in $(seq 1 30); do
              window_id=$(xdotool search --onlyvisible --name "^ClearMic$" 2>/dev/null | head -n 1 || true)
              if [ -n "$window_id" ]; then break; fi
              sleep 0.1
            done
            if [ -z "$window_id" ]; then
              echo "ClearMic window did not appear" >&2
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" || true
              exit 1
            fi
            xdotool windowclose "$window_id"
            wait "$app_pid"
          '
      - name: Build Ubuntu CLI package
        run: bash packaging/linux/build-deb.sh
      - name: Preserve Ubuntu package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-ubuntu-amd64-deb
          path: build/linux-package/dist/*.deb
          retention-days: 3
      - name: Publish test diagnostics
        if: always()
        run: cat test.log >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Ubuntu build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-ubuntu-build-log
          path: build.log
          retention-days: 3

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, ubuntu]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches project version
        run: |
          project_version=$(sed -n 's/^project(ClearMic VERSION \([^ ]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF_NAME" != "v$project_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version v$project_version" >&2
            exit 1
          fi
      - name: Download Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/windows release/ubuntu
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name clearmic-windows-msi --dir release/windows
      - name: Download Ubuntu package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name clearmic-ubuntu-amd64-deb --dir release/ubuntu
      - name: Create draft release with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' msi_files < <(find release/windows -type f -name '*.msi' -print0)
          mapfile -d '' deb_files < <(find release/ubuntu -type f -name '*.deb' -print0)
          if [[ "${#msi_files[@]}" -ne 1 || "${#deb_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one MSI and one Ubuntu .deb package" >&2
            exit 1
          fi
          sha256sum "${msi_files[0]}" "${deb_files[0]}" > release/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "${msi_files[0]}" "${deb_files[0]}" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --title "ClearMic $GITHUB_REF_NAME" --generate-notes --draft
