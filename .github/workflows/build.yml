name: Build and test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --verbose
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Preserve Windows CLI for local hardware validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-windows-validation
          path: build/Release/clearmic-cli.exe
          retention-days: 3

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install PipeWire development headers
        run: sudo apt-get update && sudo apt-get install --yes libpipewire-0.3-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build --config Release --verbose
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
