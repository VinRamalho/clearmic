name: Build and test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: |
          cmake --build build --config Release --verbose *> build.log
          $buildExitCode = $LASTEXITCODE
          Get-Content build.log
          if ($buildExitCode -ne 0) {
            Write-Output "::group::First compiler errors"
            Get-Content build.log -Tail 20 | ForEach-Object { Write-Output "::error::$_" }
            Write-Output "::endgroup::"
            Write-Output "::error::Windows build failed with exit code $buildExitCode"
            exit $buildExitCode
          }
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Preserve Windows CLI for local hardware validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-windows-validation
          path: |
            build/Release/clearmic-cli.exe
            build/Release/clearmic-desktop.exe
          retention-days: 3
      - name: Build Windows installer
        run: cpack --config build/CPackConfig.cmake -G WIX -B build/installer
      - name: Install and remove Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path build/installer -Filter *.msi | Select-Object -First 1
          if (-not $installer) { throw "CPack did not produce a Windows MSI" }
          & msiexec.exe /i $installer.FullName /qn /norestart
          if ($LASTEXITCODE -ne 0) { throw "MSI installation failed with exit code $LASTEXITCODE" }
          $installedFiles = Get-ChildItem -LiteralPath (Join-Path $env:ProgramFiles "ClearMic") -File -Recurse
          if (-not ($installedFiles.Name -contains "clearmic-desktop.exe")) { throw "Installed desktop application was not found" }
          if (-not ($installedFiles.Name -contains "clearmic-cli.exe")) { throw "Installed CLI was not found" }
          $desktopExecutable = $installedFiles | Where-Object Name -eq "clearmic-desktop.exe" | Select-Object -First 1
          $desktopProcess = Start-Process -FilePath $desktopExecutable.FullName -PassThru
          Start-Sleep -Seconds 2
          $desktopProcess.Refresh()
          if ($desktopProcess.HasExited) { throw "Installed desktop application exited during startup" }
          if (-not $desktopProcess.CloseMainWindow()) { Stop-Process -Id $desktopProcess.Id -Force }
          if (-not $desktopProcess.HasExited -and -not $desktopProcess.WaitForExit(5000)) {
            Stop-Process -Id $desktopProcess.Id -Force
            throw "Installed desktop application did not close after a window-close request"
          }
          & msiexec.exe /x $installer.FullName /qn /norestart
          if ($LASTEXITCODE -ne 0) { throw "MSI removal failed with exit code $LASTEXITCODE" }
          $remainingFiles = Get-ChildItem -LiteralPath (Join-Path $env:ProgramFiles "ClearMic") -File -Recurse -ErrorAction SilentlyContinue
          if ($remainingFiles.Name -contains "clearmic-desktop.exe") { throw "MSI removal left the desktop application installed" }
      - name: Preserve Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-windows-msi
          path: build/installer/*.msi
          retention-days: 3
      - name: Preserve Windows build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-windows-build-log
          path: build.log
          retention-days: 3

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux development dependencies
        run: sudo apt-get update && sudo apt-get install --yes libpipewire-0.3-dev libgtk-3-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good pkg-config xdotool xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja
      - name: Build
        run: cmake --build build --config Release --verbose 2>&1 | tee build.log
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure | tee test.log
      - name: Launch GTK desktop panel
        run: |
          timeout --signal=TERM 10s xvfb-run -a bash -euo pipefail -c '
            build/clearmic-cli gui &
            app_pid=$!
            window_id=""
            for _ in $(seq 1 30); do
              window_id=$(xdotool search --onlyvisible --name "^ClearMic$" 2>/dev/null | head -n 1 || true)
              if [ -n "$window_id" ]; then break; fi
              sleep 0.1
            done
            if [ -z "$window_id" ]; then
              echo "ClearMic window did not appear" >&2
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" || true
              exit 1
            fi
            xdotool windowclose "$window_id"
            wait "$app_pid"
          '
      - name: Build Ubuntu CLI package
        run: bash packaging/linux/build-deb.sh
      - name: Preserve Ubuntu package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-ubuntu-amd64-deb
          path: build/linux-package/dist/*.deb
          retention-days: 3
      - name: Publish test diagnostics
        if: always()
        run: cat test.log >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Ubuntu build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clearmic-ubuntu-build-log
          path: build.log
          retention-days: 3
